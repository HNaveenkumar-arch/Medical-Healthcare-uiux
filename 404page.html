<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly - 404 Page Not Found</title>


    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.6);
            --bg-dark: #0f172a;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;

        }


        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 1;
            animation: floatOrb 12s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #2563eb;
            top: -10%;
            left: -5%;
            opacity: 0.4;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #10b981;
            bottom: -20%;
            right: -10%;
            opacity: 0.2;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0% {
                transform: translateY(0) scale(1);
            }

            100% {
                transform: translateY(50px) scale(1.2);
            }
        }


        .error-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 40px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            max-width: 650px;
            width: 90%;
            transform-style: preserve-3d;
        }


        .error-code {
            font-size: 160px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 15px 35px var(--primary-glow);
            display: inline-block;
            transition: transform 0.2s ease-out;
        }

        .error-title {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
            transition: transform 0.2s ease-out;
        }

        .error-desc {
            font-size: 17px;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }


        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            transition: transform 0.2s ease-out;
        }

        .btn {
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.5);
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-outline:hover {
            border-color: #ffffff;
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
        }


        @media (max-width: 768px) {
            .error-code {
                font-size: 120px;
            }

            .error-title {
                font-size: 28px;
            }

            .error-wrapper {
                padding: 40px 20px;
            }
        }

        @media (max-width: 576px) {
            .error-code {
                font-size: 90px;
            }

            .error-title {
                font-size: 22px;
            }

            .error-desc {
                font-size: 15px;
            }

            .btn-group {
                flex-direction: column;
                gap: 15px;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>


    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>


    <div class="error-wrapper" id="errorCard">
        <h1 class="error-code" id="parallaxText1">404</h1>
        <h2 class="error-title" id="parallaxText2">Page Not Found</h2>
        <p class="error-desc">We couldn't find the page you're looking for. It might have been moved, deleted, or you
            may have mistyped the URL.</p>

        <div class="btn-group" id="parallaxBtn">

            <button onclick="history.back()" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Go Back</button>
            <a href="index.html" class="btn btn-outline"><i class="fas fa-home"></i> Back to Home</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const card = document.getElementById("errorCard");
            const text1 = document.getElementById("parallaxText1");
            const text2 = document.getElementById("parallaxText2");
            const btn = document.getElementById("parallaxBtn");


            if (window.innerWidth > 768) {
                document.addEventListener("mousemove", (e) => {
                    let xAxis = (window.innerWidth / 2 - e.pageX) / 30;
                    let yAxis = (window.innerHeight / 2 - e.pageY) / 30;


                    card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;


                    text1.style.transform = `translateZ(60px)`;
                    text2.style.transform = `translateZ(40px)`;
                    btn.style.transform = `translateZ(30px)`;
                });


                document.addEventListener("mouseleave", () => {
                    card.style.transition = `all 0.5s ease`;
                    card.style.transform = `rotateY(0deg) rotateX(0deg)`;

                    text1.style.transform = `translateZ(0px)`;
                    text2.style.transform = `translateZ(0px)`;
                    btn.style.transform = `translateZ(0px)`;
                });


                document.addEventListener("mouseenter", () => {
                    card.style.transition = `none`;
                });
            }
        });
    </script>

</body>

</html>
